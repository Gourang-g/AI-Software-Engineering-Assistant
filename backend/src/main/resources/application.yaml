  spring:
  application:
    name: demo

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_assistant
    username: postgres
    password: gourang123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        model: qwen2.5:1.5b-instruct-q5_0
        options:
          temperature: 0.2
          num-predict: 512

      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

logging:
  level:
    org:
      hibernate:
        tool:
          schema: DEBUG
        orm:
          boot: DEBUG

app:
  projects:
    upload-dir: uploads/projects
